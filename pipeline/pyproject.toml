[project]
name = "colombia-birds-pipeline"
version = "0.1.0"
description = "Data pipeline: builds data/ from open sources (ACO, eBird, BIRDBASE, Wikidata, Wikipedia, Commons, iNaturalist)"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "pyyaml>=6",
  "pillow>=10",
  "boto3>=1.34",
  "python-dotenv>=1",
  "shapely>=2",
]

[tool.uv]
package = false
