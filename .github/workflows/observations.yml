name: observations

# Every 2 hours: Anya's new eBird checklists from the public trip report (pipeline step `ebird_trip`, no AI), then
# `observations` rebuilds data/observations.json, then `igor500` refreshes data/igor500.json (hidden page /igor-500/).
# Commits pipeline/sources/ebird/trip_report.csv, its state file and data/ back via pipeline/ci_commit.sh, which
# dispatches deploy.yml only after a real push: an unchanged report writes nothing (ebird_trip and igor500 leave
# their files untouched), so most runs commit and deploy nothing.
# With the EBIRD_API_KEY secret the step reads full checklists from the eBird API (protocol, effort, comments);
# without it, species and counts from the trip report only. The manual export (`observations --import`) stays the
# richer source and wins per checklist.
# Two triggers every 2 hours: the Cloudflare Worker cron at :47 (worker/, `47 */2 * * *`, dispatches this workflow
# on main with input scheduled=true; fires to the minute) and GitHub's own cron at :17 as a fallback (GitHub delays
# schedules by hours under load). A duplicate run is harmless: nothing new, a couple of requests, no commit.
# Scheduled runs stop by themselves the day after the trip: the guard step compares today (Bogotá) with the last
# date of data/itinerary.json + 1 day and skips the fetch when it is later. This applies to the GitHub schedule and
# to the Worker dispatch (scheduled=true); a human «Run workflow» with the default input always runs.

on:
  schedule:
    - cron: "17 */2 * * *"   # fallback; off the full hour: GitHub delays :00 schedules for hours under load (19.10: 5–7 h)
  workflow_dispatch:
    inputs:
      scheduled:
        description: "set by the Cloudflare cron; applies the trip-end guard like a schedule"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # to dispatch deploy.yml after committing data (bot pushes don't trigger workflows)

concurrency:
  group: pipeline-light
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STEPS: ebird_trip observations
      EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      # Files that differ from this commit are what ci_commit.sh commits (see pipeline/ci_commit.sh).
      - name: Remember start commit
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # Scheduled runs only (GitHub cron, or the Worker's dispatch with scheduled=true): nothing to fetch from the day
      # after the trip's last day (plus one day for late uploads).
      - name: Still on the trip?
        id: trip
        env:
          SCHEDULED: ${{ inputs.scheduled }}
        run: |
          python3 - <<'PY'
          import json, datetime, os
          days = json.load(open("data/itinerary.json"))
          days = days["days"] if isinstance(days, dict) else days
          last = max(datetime.date.fromisoformat(d["date"]) for d in days)
          today = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=-5))).date()
          scheduled = os.environ.get("SCHEDULED", "").strip().lower() == "true"
          manual = os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch" and not scheduled
          active = manual or today <= last + datetime.timedelta(days=1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"active={'true' if active else 'false'}\n")
          kind = "manual" if manual else "scheduled"
          print(f"::notice::{kind} run; trip ends {last}, today {today} (Bogotá): {'running' if active else 'skipping, trip over'}")
          PY

      # A few requests per run once the state file is committed: no ci_run.sh and no HTTP cache (the trip report
      # answers are no-store, and the step keeps its own state in pipeline/sources/ebird/trip_report_state.json).
      - name: Fetch trip report and rebuild observations
        if: steps.trip.outputs.active == 'true'
        working-directory: pipeline
        run: uv run python run.py ebird_trip observations

      # Hidden page /igor-500/: data/igor500.json (derived only, see pipeline/steps/build_igor500.py), 4 requests to
      # the same trip report. continue-on-error: a failed refresh (ebird.org down, person not found) leaves the old
      # file and must not block the observations commit below; the next run tries again.
      - name: Refresh /igor-500/ data
        if: steps.trip.outputs.active == 'true'
        continue-on-error: true
        working-directory: pipeline
        run: uv run python run.py igor500

      - name: Commit data
        if: steps.trip.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY: "1"
        run: |
          pipeline/ci_commit.sh "data: eBird trip report"
