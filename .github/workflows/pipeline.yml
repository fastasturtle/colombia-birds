name: pipeline

# Runs data pipeline steps (see pipeline/README.md) and commits changed files under data/ back to the
# branch it was started on. Wikimedia rate-limits shared IPs; GitHub runners usually fare better than
# dev containers, and each step is resumable, so a failed/partial run can simply be re-dispatched.

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Space-separated steps (aco ebird birdbase wikidata build wikipedia photos upload sites)"
        type: string
        default: "wikipedia photos upload"
      only:
        description: "Optional space-separated species slugs to restrict per-species steps to"
        type: string
        required: false
        default: ""
      queue:
        description: "Concurrency queue: heavy (multi-hour photo/text runs) or light (quick steps: hotspots, sites, family_names, gbif_sites, basemap)"
        type: choice
        options: [heavy, light]
        default: heavy

permissions:
  contents: write
  actions: write   # to dispatch deploy.yml after committing data (bot pushes don't trigger workflows)

concurrency:
  group: pipeline-${{ inputs.queue || 'heavy' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      STEPS: ${{ inputs.steps }}
      # time budget for run.py: per-species steps stop cleanly (exit 0) after this many minutes, well
      # before the 300-minute hard step timeout, so data/ is consistent when the commit step runs
      MAX_MINUTES: 270
      ONLY_SLUGS: ${{ inputs.only }}
      XENO_CANTO_API_KEY: ${{ secrets.XENO_CANTO_API_KEY }}
      EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_CLOUDFLARE_TOKEN: ${{ secrets.R2_CLOUDFLARE_TOKEN }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || '7979772a9baad2ab2e88eb52df9c590b' }}
      R2_BUCKET: colombia-birds
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      # Files that differ from this commit are what ci_commit.sh commits (see pipeline/ci_commit.sh).
      - name: Remember start commit
        run: echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # HTTP response cache (API JSON, not images) lives in R2 under cache/http/ (pipeline/cache_sync.py),
      # so re-runs don't re-hit Wikimedia/iNaturalist. A failed pull only means a cold cache.
      - name: Pull HTTP cache from R2
        working-directory: pipeline
        run: uv run python cache_sync.py pull || echo "::warning::HTTP cache pull failed, running with a cold cache"

      # ci_run.sh runs run.py and, every 20 minutes while it runs, commits+pushes data/ progress (and
      # dispatches deploy.yml on main) and pushes the HTTP cache to R2, so a cancelled or crashed run
      # loses at most 20 minutes. Intermediate flush failures only warn.
      - name: Run pipeline
        working-directory: pipeline
        # hard stop only; MAX_MINUTES (270) normally ends the run first. 30 min left for the final flush.
        timeout-minutes: 300
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY: "1"
        run: ./ci_run.sh uv run python run.py $STEPS

      # Final flush. ci_commit.sh builds the commit from the remote tip plus the paths the run changed
      # (data/, docs/research/hotspots-check.md, pipeline/mappings/) in a temporary index, so it never
      # rebases or touches the working tree; other touched files (e.g. pipeline/uv.lock) are ignored.
      # 3 push attempts (light and heavy queues may push concurrently). A push made with GITHUB_TOKEN
      # does not trigger other workflows, so on main it dispatches deploy.yml itself (DEPLOY=1).
      - name: Commit data changes
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY: "1"
        run: |
          git status --short > "$RUNNER_TEMP/status.txt"
          echo "--- git status after the run ($(wc -l < "$RUNNER_TEMP/status.txt") paths; first 50):"
          head -50 "$RUNNER_TEMP/status.txt"
          pipeline/ci_commit.sh "data: pipeline run ($STEPS)"

      - name: Push HTTP cache to R2
        if: always()
        working-directory: pipeline
        run: uv run python cache_sync.py push
