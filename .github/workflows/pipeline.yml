name: pipeline

# Runs data pipeline steps (see pipeline/README.md) and commits changed files under data/ back to the
# branch it was started on. Wikimedia rate-limits shared IPs; GitHub runners usually fare better than
# dev containers, and each step is resumable, so a failed/partial run can simply be re-dispatched.

on:
  workflow_dispatch:
    inputs:
      steps:
        description: "Space-separated steps (aco ebird birdbase wikidata build wikipedia photos upload sites)"
        type: string
        default: "wikipedia photos upload"
      only:
        description: "Optional space-separated species slugs to restrict per-species steps to"
        type: string
        required: false
        default: ""
      queue:
        description: "Concurrency queue: heavy (multi-hour photo/text runs) or light (quick steps: hotspots, sites, family_names, gbif_sites, basemap)"
        type: choice
        options: [heavy, light]
        default: heavy

permissions:
  contents: write
  actions: write   # to dispatch deploy.yml after committing data (bot pushes don't trigger workflows)

concurrency:
  group: pipeline-${{ inputs.queue || 'heavy' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      STEPS: ${{ inputs.steps }}
      # time budget for run.py: per-species steps stop cleanly (exit 0) after this many minutes, well
      # before the 300-minute hard step timeout, so data/ is consistent when the commit step runs
      MAX_MINUTES: 270
      ONLY_SLUGS: ${{ inputs.only }}
      XENO_CANTO_API_KEY: ${{ secrets.XENO_CANTO_API_KEY }}
      EBIRD_API_KEY: ${{ secrets.EBIRD_API_KEY }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_CLOUDFLARE_TOKEN: ${{ secrets.R2_CLOUDFLARE_TOKEN }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID || secrets.R2_ACCOUNT_ID || '7979772a9baad2ab2e88eb52df9c590b' }}
      R2_BUCKET: colombia-birds
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock

      # HTTP response cache (API JSON, not images) so re-runs don't re-hit Wikimedia/iNaturalist.
      # Split restore/save: actions/cache's post-step save is skipped on cancel/timeout, which lost
      # the cache of long runs. The explicit save below runs with if: always().
      # run_attempt in the key: cache keys are immutable, and a re-run keeps the same run_id.
      - name: Restore HTTP cache
        uses: actions/cache/restore@v4
        with:
          path: |
            pipeline/cache
            !pipeline/cache/media
          key: pipeline-http-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pipeline-http-

      - name: Run pipeline
        working-directory: pipeline
        # hard stop only; MAX_MINUTES (270) normally ends the run first. 30 min left for the commit step.
        timeout-minutes: 300
        run: uv run python run.py $STEPS

      # Saved before the commit step so the cache survives even if the commit/push fails.
      - name: Save HTTP cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            pipeline/cache
            !pipeline/cache/media
          key: pipeline-http-${{ github.run_id }}-${{ github.run_attempt }}

      # Commits only the pipeline outputs. Anything else the run touched (e.g. pipeline/uv.lock rewritten
      # by `uv run`) is printed, then discarded with `git checkout -- .` after the commit: those changes
      # are never wanted in git, and leaving them made `git pull --rebase` refuse to run ("You have
      # unstaged changes"), which lost a whole run's results. --autostash is kept as a second safety net
      # (e.g. for untracked files a rebase would otherwise trip over).
      - name: Commit data changes
        if: always()
        id: commit
        run: |
          git config user.name "colombia-birds-bot"
          git config user.email "colombia-birds-bot@users.noreply.github.com"
          git status --short > "$RUNNER_TEMP/status.txt"
          echo "--- git status after the run ($(wc -l < "$RUNNER_TEMP/status.txt") paths; first 50):"
          head -50 "$RUNNER_TEMP/status.txt"
          git add -A data/
          for p in docs/research/hotspots-check.md pipeline/mappings/; do
            if [ -e "$p" ]; then git add -A "$p"; fi
          done
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -q -m "data: pipeline run ($STEPS)"
          git show --stat --oneline HEAD | tail -3
          # drop unrelated tracked changes (not committed above), so the rebase has a clean tree
          git checkout -- .
          # light and heavy queues may push concurrently: retry pull+push a few times
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "push attempt $attempt failed, retrying"
            sleep $((attempt * 10))
          done
          echo "::error::could not push data commit after 3 attempts"
          exit 1

      # A push made with GITHUB_TOKEN does not trigger other workflows, so start the site deploy explicitly.
      - name: Deploy site
        if: always() && steps.commit.outputs.pushed == '1' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
