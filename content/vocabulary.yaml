# Английские слова бёрдера: карточки и словарь на странице /words/ (формат — content/README.md).
# en, ru, note пишутся руками; freq и examples пересчитывает скрипт:
#   python3 scripts/vocab_freq.py --fill content/vocabulary.yaml
# Слово ищется вместе с простыми формами (rump -> rumped, bar -> barred, belly -> bellied).

